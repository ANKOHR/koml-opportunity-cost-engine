[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "koml-opportunity-cost-engine"
version = "0.1.0"
description = "Deterministic opportunity cost from explicit task valuations"
requires-python = ">=3.10"

[project.scripts]
koce = "koml_opportunity_cost_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
